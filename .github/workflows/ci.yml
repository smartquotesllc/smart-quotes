name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Build-time placeholders — real secrets live in Vercel project settings
          CRM_INGEST_URL: https://app.smartquotesllc.com/api/ingest/lead
          CRM_INGEST_API_KEY: ci-placeholder-not-a-real-secret
